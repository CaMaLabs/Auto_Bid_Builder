name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyinstaller

      - name: Run tests
        run: pytest -q

      - name: Determine app version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          else {
            $version = python -c "import auto_bid_builder; print(auto_bid_builder.__version__)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name AutoBidBuilder `
            --paths "$PWD" `
            --collect-submodules auto_bid_builder `
            --collect-all keyring `
            --hidden-import keyring.backends.Windows `
            packaging/desktop_entry.py

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\AutoBidBuilder.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen AutoBidBuilder.exe failed smoke test with exit code $($process.ExitCode)."
          }

      - name: Build portable update package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\AutoBidBuilder.exe -DestinationPath dist\AutoBidBuilder-portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build guided installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\AutoBidBuilder.iss"

      - name: Verify upgrade replaces installed prior version
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP "AutoBidBuilder-v0.4.13-Setup.exe"
          $baselineUrl = "https://github.com/CaMaLabs/Auto_Bid_Builder/releases/download/v0.4.13/JTI_Auto_Bid_Builder_Setup.exe"
          Invoke-WebRequest -Uri $baselineUrl -OutFile $baseline -MaximumRedirection 10
          $installDir = Join-Path $env:RUNNER_TEMP "abb_upgrade_test"
          $installerArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/CLOSEAPPLICATIONS", "/FORCECLOSEAPPLICATIONS", "/NORESTARTAPPLICATIONS",
            "/DIR=$installDir")
          $old = Start-Process -FilePath $baseline -ArgumentList $installerArgs -Wait -PassThru
          if ($old.ExitCode -ne 0) { throw "Previous-version install failed: $($old.ExitCode)" }
          $installedExe = Join-Path $installDir "AutoBidBuilder.exe"
          if (-not (Test-Path $installedExe)) { throw "Previous installed EXE was not found." }
          $oldHash = (Get-FileHash -Algorithm SHA256 $installedExe).Hash

          $newSetup = "dist/installer/JTI_Auto_Bid_Builder_Setup.exe"
          $upgrade = Start-Process -FilePath $newSetup -ArgumentList $installerArgs -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "New-version upgrade failed: $($upgrade.ExitCode)" }

          $actualHash = (Get-FileHash -Algorithm SHA256 $installedExe).Hash
          $expectedHash = (Get-FileHash -Algorithm SHA256 "dist/AutoBidBuilder.exe").Hash
          if ($actualHash -ne $expectedHash) {
            throw "In-place upgrade did not replace installed executable."
          }
          if ($oldHash -eq $actualHash) {
            throw "The installed executable was unchanged after upgrading."
          }
          $smoke = Start-Process -FilePath $installedExe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Updated installed EXE smoke test failed." }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoBidBuilder-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/AutoBidBuilder.exe
            dist/AutoBidBuilder-portable.zip
            dist/installer/JTI_Auto_Bid_Builder_Setup.exe
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Auto Bid Builder v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/AutoBidBuilder-portable.zip
            dist/installer/JTI_Auto_Bid_Builder_Setup.exe
