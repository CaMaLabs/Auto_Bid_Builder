[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-bid-builder"
version = "0.1.0"
description = "Evidence-backed bid assistance for commercial millwork and custom fabrication"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11", "PyMuPDF>=1.24"]

[project.scripts]
auto-bid-builder = "auto_bid_builder.cli:main"

[tool.setuptools.packages.find]
include = ["auto_bid_builder*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
