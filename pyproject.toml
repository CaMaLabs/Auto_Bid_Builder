[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-bid-builder"
version = "0.1.0"
description = "Evidence-backed bid assistance for commercial millwork and custom fabrication"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
